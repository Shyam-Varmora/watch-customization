<!DOCTYPE html>
<html>
<head>
  <title>Saved Designs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background:#000; color:white; padding:40px;">

<h1>My Saved Designs</h1>

<div id="savedContainer"></div>

<script>
const container = document.getElementById("savedContainer");

// GET ALL SAVED DESIGNS
let designs = JSON.parse(localStorage.getItem("savedDesigns")) || [];

if (designs.length === 0) {
  container.innerHTML = "<p>No saved designs</p>";
} else {
  designs.forEach((design, index) => {
    const div = document.createElement("div");
    div.style.marginBottom = "20px";
    div.style.padding = "15px";
    div.style.border = "1px solid #444";

    div.innerHTML = `
      <p>Design ${index + 1}</p>
      <button onclick="loadDesign(${index})">Load</button>
      <button onclick="deleteDesign(${index})">Delete</button>
    `;

    container.appendChild(div);
  });
}

function loadDesign(index) {
  const designs = JSON.parse(localStorage.getItem("savedDesigns"));
  localStorage.setItem("loadedDesign", JSON.stringify(designs[index]));
  window.location.href = "index.html";
}

function deleteDesign(index) {
  let designs = JSON.parse(localStorage.getItem("savedDesigns"));
  designs.splice(index, 1);
  localStorage.setItem("savedDesigns", JSON.stringify(designs));
  location.reload();
}
</script>

</body>
</html>
